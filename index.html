<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <title>Dearie</title>
  </head>
  <body>
    <div class="welcome">
      <img src="images/pixel-bunny.png" alt="white bunny with pink bow" />
      <h1>Welcome to Dearie♡</h1>
      <p>Your little corner of calm.</p>
      <button>Get Started</button>
    </div>
    <div class="onboarding">
      <h2>What should we call you?</h2>
      <p>Let's make this space all about you!</p>
      <input type="text" id="name" placeholder="Your name..." required />
      <button id="continueBtn">Continue ♡</button>
      <p class="name-error">Please enter your name before continuing.</p>
    </div>
    <main class="dashboard">
      <header>
        <h1>Dearie ♡</h1>
      </header>

      <div class="greeting">
        <h2>Hi, Imani! ♡</h2>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
